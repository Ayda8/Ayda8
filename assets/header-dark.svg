<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Aida Kabiri — Java backend developer building AI agents for assistive technology</title>
<desc id="d">Name banner with a small diagram: a user talks to an AI agent, safety rules decide, and a caregiver is notified.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0F1430"/><stop offset="1" stop-color="#1A2250"/></linearGradient>
  <linearGradient id="ink" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset=".55" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A3364"/></pattern>
  <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
</defs>
<style>
  @keyframes flow { from { stroke-dashoffset: 40 } to { stroke-dashoffset: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .flow { stroke-dasharray: 6 14; animation: flow 1.6s linear infinite }
  .p1 { animation: pulse 2.4s ease-in-out infinite }
  .p2 { animation: pulse 2.4s ease-in-out .8s infinite }
  .p3 { animation: pulse 2.4s ease-in-out 1.6s infinite }
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect x="660" width="540" height="400" fill="url(#grid)"/>
  <path d="M0 398H1200" stroke="url(#ink)" stroke-width="3"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="15" fill="#AEB6DA">
    <circle cx="60" cy="42" r="6" fill="#7C8CFF"/><circle cx="80" cy="42" r="6" fill="#2DD4BF"/><circle cx="100" cy="42" r="6" fill="#FBBF24"/>
    <text x="124" y="47">~/Ayda8</text>
    <text x="1140" y="47" text-anchor="end" fill="#2DD4BF">java 21 · spring ai</text>
  </g>
  <path d="M52 70H1148" stroke="#2C3566"/>
  <text x="60" y="114" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="4" fill="#2DD4BF">BACKEND · AI AGENTS · ASSISTIVE TECH</text>
  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-weight="800" letter-spacing="-4">
    <text x="54" y="212" font-size="96" fill="#F4F5FF">AIDA</text>
    <text x="54" y="306" font-size="96" fill="url(#ink)">KABIRI<tspan fill="#F4F5FF">.</tspan></text>
  </g>
  <text x="60" y="352" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#AEB6DA">Java backends. AI agents that care.</text>

  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="14">
    <path class="flow" d="M790 130 L930 130" stroke="#7C8CFF" stroke-width="2.5" fill="none"/>
    <path class="flow" d="M960 158 L960 238" stroke="#2DD4BF" stroke-width="2.5" fill="none"/>
    <path class="flow" d="M990 266 L1090 266" stroke="#FBBF24" stroke-width="2.5" fill="none"/>

    <circle cx="760" cy="130" r="30" fill="#141A3A" stroke="#7C8CFF" stroke-width="2.5"/>
    <circle class="p1" cx="760" cy="130" r="38" fill="none" stroke="#7C8CFF" stroke-width="1.5"/>
    <text x="760" y="135" text-anchor="middle" fill="#F4F5FF">user</text>
    <text x="760" y="186" text-anchor="middle" fill="#AEB6DA" font-size="12">"I missed my pill"</text>

    <circle cx="960" cy="130" r="30" fill="#141A3A" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle class="p2" cx="960" cy="130" r="38" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="960" y="135" text-anchor="middle" fill="#F4F5FF">agent</text>
    <text x="1012" y="100" fill="#AEB6DA" font-size="12">LLM + tools</text>

    <rect x="914" y="240" width="92" height="52" rx="12" fill="#141A3A" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="960" y="271" text-anchor="middle" fill="#F4F5FF">rules</text>
    <text x="960" y="320" text-anchor="middle" fill="#AEB6DA" font-size="12">safety stays out of the model</text>

    <circle cx="1120" cy="266" r="30" fill="#141A3A" stroke="#FBBF24" stroke-width="2.5"/>
    <circle class="p3" cx="1120" cy="266" r="38" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1120" y="271" text-anchor="middle" fill="#F4F5FF" font-size="12">family</text>
  </g>
</g>
</svg>
