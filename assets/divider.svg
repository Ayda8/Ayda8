<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="img" aria-label="divider">
<defs>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#7C8CFF" stop-opacity="0"/>
  <stop offset="40%" stop-color="#7C8CFF"/>
  <stop offset="60%" stop-color="#2DD4BF"/>
  <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
</linearGradient>
</defs>
<style>@keyframes sw{from{transform:translateX(-420px)}to{transform:translateX(1000px)}}.s{animation:sw 4s linear infinite}</style>
<rect x="0" y="4" width="1000" height="2" fill="#7C8CFF" opacity="0.25"/>
<g class="s"><rect x="0" y="3" width="420" height="4" rx="2" fill="url(#sweep)"/></g>
</svg>
